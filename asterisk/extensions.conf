; The only dialplan in this container. Dial 3323 ("DEAD") to reach the Deadline Line.
[deadline-line]
exten => 3323,1,Answer()
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
 same => n,Hangup()

; Anything else: a polite message.
exten => _X.,1,Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()
