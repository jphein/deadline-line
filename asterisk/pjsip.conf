; Loopback-only SIP for the demo softphone. No trunks, no PSTN.
[transport-loopback]
type=transport
protocol=udp
bind=127.0.0.1:5070

[caller]
type=endpoint
transport=transport-loopback
context=deadline-line
disallow=all
allow=ulaw,alaw,slin
auth=caller-auth
aors=caller
direct_media=no
rtp_symmetric=yes

[caller]
type=aor
max_contacts=2
remove_existing=yes

; caller-auth (username "caller", random password) is generated by setup.sh:
#include demo-auth.conf
